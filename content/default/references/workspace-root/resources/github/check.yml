name: Check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Full Check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Read Node.js version
        id: node-runtime
        run: echo "runtime=node@$(jq -er '.engines.node' package.json)" >> "$GITHUB_OUTPUT"
      - name: Set up pnpm and Node.js
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: ${{ steps.node-runtime.outputs.runtime }}
          install: false
          cache: true
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Light Check
        run: node --conditions=source scripts/task-gates.ts check
      - name: Run Heavy Check
        id: run-heavy-check
        run: node --conditions=source scripts/task-gates.ts check:heavy
      - name: Stage Check diagnostics
        id: stage-diagnostics
        if: failure()
        env:
          PLAYWRIGHT_DIAGNOSTIC_OWNER_PATHS: |-
            apps/web
          VITEST_BROWSER_DIAGNOSTIC_OWNER_PATHS: |-
            apps/web
        run: |
          rm -rf .template-ci-diagnostics
          mkdir -p .template-ci-diagnostics
          printf '%s\n' "$PLAYWRIGHT_DIAGNOSTIC_OWNER_PATHS" | while IFS= read -r owner_path; do
            [ -n "$owner_path" ] || continue
            for diagnostic_directory in test-results playwright-report; do
              source_path="$owner_path/$diagnostic_directory"
              destination_path=".template-ci-diagnostics/$owner_path/$diagnostic_directory"
              if [ -d "$source_path" ]; then
                mkdir -p "$(dirname "$destination_path")"
                cp -R "$source_path" "$destination_path"
              fi
            done
          done
          printf '%s\n' "$VITEST_BROWSER_DIAGNOSTIC_OWNER_PATHS" | while IFS= read -r owner_path; do
            [ -n "$owner_path" ] || continue
            diagnostic_directory=".vitest/attachments/failure-screenshots"
            source_path="$owner_path/$diagnostic_directory"
            destination_path=".template-ci-diagnostics/$owner_path/$diagnostic_directory"
            if [ -d "$source_path" ]; then
              mkdir -p "$(dirname "$destination_path")"
              cp -R "$source_path" "$destination_path"
            fi
          done
      - name: Upload Check diagnostics
        id: upload-diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: check-diagnostics
          path: .template-ci-diagnostics
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

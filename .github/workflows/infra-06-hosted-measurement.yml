name: Temporary infra-06 hosted candidate proof

on:
  push:
    branches:
      - codex/infra-06-hosted-harness

permissions:
  contents: read

concurrency:
  group: infra-06-hosted-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    name: Cold and warm formal fixture scope
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      CI: "true"
      TEMPLATE_FIXTURE_EVIDENCE_READ: "1"
      TEMPLATE_FIXTURE_EVIDENCE_WRITE: "1"
    steps:
      - name: Check out fixed 06 candidate
        uses: actions/checkout@v7
        with:
          ref: 4fd71b27b4bc3ab6bc68d9b7201c4ceeb5129f75
          persist-credentials: false

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json

      - name: Set up isolated Docker Buildx builder
        uses: docker/setup-buildx-action@v4
        with:
          name: infra-06-hosted
          driver: docker-container
          use: true

      - name: Allocate private measurement paths
        shell: bash
        run: |
          set -euo pipefail
          measure_root="$RUNNER_TEMP/infra-06-measurement"
          fixture_state="$RUNNER_TEMP/infra-06-fixture-state"
          pnpm_store="$RUNNER_TEMP/infra-06-pnpm-store"
          playwright_browsers="$RUNNER_TEMP/infra-06-playwright-browsers"
          mkdir -p "$measure_root/records/preparation" "$measure_root/activity"
          {
            printf 'MEASURE_ROOT=%s\n' "$measure_root"
            printf 'TEMPLATE_FIXTURE_EVIDENCE_DIR=%s/evidence\n' "$fixture_state"
            printf 'TEMPLATE_FIXTURE_EVIDENCE_ACTIVITY_DIR=%s/activity\n' "$measure_root"
            printf 'TEMPLATE_FIXTURE_EVIDENCE_RUN_ID=infra-06-%s\n' "$GITHUB_RUN_ID"
            printf 'TEMPLATE_FIXTURE_EVIDENCE_RUN_ATTEMPT=%s\n' "$GITHUB_RUN_ATTEMPT"
            printf 'TEMPLATE_FIXTURE_BUILDKIT_CACHE_DIR=%s/cache/buildkit\n' "$fixture_state"
            printf 'TEMPLATE_FIXTURE_PNPM_CACHE_DIR=%s/cache/pnpm\n' "$fixture_state"
            printf 'TEMPLATE_FIXTURE_CARGO_CACHE_DIR=%s/cache/cargo\n' "$fixture_state"
            printf 'TEMPLATE_FIXTURE_WORKSPACE_DIR=%s/workspaces\n' "$fixture_state"
            printf 'pnpm_config_store_dir=%s\n' "$pnpm_store"
            printf 'PLAYWRIGHT_BROWSERS_PATH=%s\n' "$playwright_browsers"
          } >> "$GITHUB_ENV"
          printf 'private measurement root: %s\n' "$measure_root"
          printf 'fixture caches/evidence/workspaces: %s\n' "$fixture_state"
          printf 'root pnpm store: %s\n' "$pnpm_store"
          printf 'Playwright browsers: %s\n' "$playwright_browsers"

      - name: Install dependencies
        shell: bash
        run: |
          set +e
          /usr/bin/time -f 'wall_seconds=%e user_seconds=%U sys_seconds=%S max_rss_kb=%M exit=%x' \
            -o "$MEASURE_ROOT/records/preparation/pnpm-install.time" \
            pnpm install --frozen-lockfile \
            > "$MEASURE_ROOT/records/preparation/pnpm-install.log" 2>&1
          result=$?
          printf 'pnpm install --frozen-lockfile\t%s\n' "$result" \
            > "$MEASURE_ROOT/records/preparation/pnpm-install.exit"
          cat "$MEASURE_ROOT/records/preparation/pnpm-install.log"
          exit "$result"

      - name: Validate fixture gate prerequisites
        shell: bash
        run: |
          set -euo pipefail
          {
            docker version --format '{{.Server.Version}}'
            pnpm --filter @ykdz/template-checks exec devcontainer --version
          } > "$MEASURE_ROOT/records/preparation/fixture-prerequisites.log" 2>&1
          cat "$MEASURE_ROOT/records/preparation/fixture-prerequisites.log"

      - name: Prepare shell checks
        shell: bash
        run: |
          set +e
          /usr/bin/time -f 'wall_seconds=%e user_seconds=%U sys_seconds=%S max_rss_kb=%M exit=%x' \
            -o "$MEASURE_ROOT/records/preparation/shellcheck-install.time" \
            bash -c 'sudo apt-get update && sudo apt-get install -y shellcheck strace' \
            > "$MEASURE_ROOT/records/preparation/shellcheck-install.log" 2>&1
          result=$?
          printf 'sudo apt-get update && sudo apt-get install -y shellcheck strace\t%s\n' "$result" \
            > "$MEASURE_ROOT/records/preparation/shellcheck-install.exit"
          cat "$MEASURE_ROOT/records/preparation/shellcheck-install.log"
          exit "$result"

      - name: Probe seccomp-bpf execve observation
        shell: bash
        run: |
          set +e
          pnpm_executable=$(command -v pnpm)
          strace -f --seccomp-bpf -qq -e trace=execve -P "$pnpm_executable" \
            -o "$MEASURE_ROOT/records/preparation/strace-probe.execve.log" -- pnpm --version \
            > "$MEASURE_ROOT/records/preparation/strace-probe.stdout" \
            2> "$MEASURE_ROOT/records/preparation/strace-probe.stderr"
          result=$?
          if [[ "$result" -eq 0 ]] && ! grep -Eq 'execve\(.* = 0$' \
            "$MEASURE_ROOT/records/preparation/strace-probe.execve.log"; then
            printf 'strace probe did not record the pnpm execve.\n' \
              >> "$MEASURE_ROOT/records/preparation/strace-probe.stderr"
            result=1
          fi
          printf 'strace -f --seccomp-bpf -e trace=execve -- pnpm --version\t%s\n' "$result" \
            > "$MEASURE_ROOT/records/preparation/strace-probe.exit"
          cat "$MEASURE_ROOT/records/preparation/strace-probe.stdout"
          cat "$MEASURE_ROOT/records/preparation/strace-probe.stderr" >&2
          exit "$result"

      - name: Prepare browser checks
        shell: bash
        run: |
          set +e
          /usr/bin/time -f 'wall_seconds=%e user_seconds=%U sys_seconds=%S max_rss_kb=%M exit=%x' \
            -o "$MEASURE_ROOT/records/preparation/playwright-install.time" \
            pnpm --filter @ykdz/template-builtin-presets exec playwright install --with-deps chromium \
            > "$MEASURE_ROOT/records/preparation/playwright-install.log" 2>&1
          result=$?
          printf 'playwright install --with-deps chromium\t%s\n' "$result" \
            > "$MEASURE_ROOT/records/preparation/playwright-install.exit"
          cat "$MEASURE_ROOT/records/preparation/playwright-install.log"
          exit "$result"

      - name: Record runner, source, and cold-cache boundary
        shell: bash
        run: |
          set -euo pipefail
          records="$MEASURE_ROOT/records"
          {
            printf 'measured_source_commit=%s\n' "$(git rev-parse HEAD)"
            printf 'expected_source_commit=4fd71b27b4bc3ab6bc68d9b7201c4ceeb5129f75\n'
            printf 'measurement_GITHUB_SHA=4fd71b27b4bc3ab6bc68d9b7201c4ceeb5129f75\n'
            printf 'workflow_event_ref=%s\n' "$GITHUB_REF"
            printf 'workflow_event_sha=%s\n' "$GITHUB_SHA"
            printf 'workflow_file_in_checked_out_source='
            if [[ -e .github/workflows/infra-06-hosted-measurement.yml ]]; then printf 'present\n'; else printf 'absent\n'; fi
            printf 'actions_cache_restore_steps=0\n'
            printf 'setup_node_pnpm_cache=disabled\n'
            printf 'turbo_remote_cache=disabled\n'
            printf 'root_pnpm_install_invocations=1\n'
            printf 'root_pnpm_store=prepared_once_before_cold_and_shared_with_warm\n'
            printf 'playwright_browser_bundle=prepared_once_before_cold_and_shared_with_warm\n'
            printf 'apt_get_update_invocations=1\n'
            printf 'apt_get_install_invocations=1\n'
            printf 'apt_packages=shellcheck,strace\n'
            printf 'playwright_chromium_install_invocations=1\n'
            printf 'formal_gate_host_pnpm_dependency_install_calls=recorded_per_gate_by_strace_seccomp_bpf\n'
            printf 'strace_probe_invocations=1\n'
            printf 'fixture_dependency_installation_events=recorded_by_native_activity_ledger\n'
            printf '\n--- runner ---\n'
            date -u '+captured_utc=%Y-%m-%dT%H:%M:%SZ'
            cat /etc/os-release
            uname -a
            printf 'nproc=%s\n' "$(nproc)"
            grep '^Cpus_allowed_list:' /proc/self/status
            cat /proc/loadavg
            lscpu
            free -h
            df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
            printf '\n--- tools ---\n'
            node --version
            pnpm --version
            pnpm store path
            docker version
            docker buildx version
            docker buildx inspect infra-06-hosted
            pnpm --filter @ykdz/template-checks exec devcontainer --version
            pnpm --filter @ykdz/template-builtin-presets exec playwright --version
            shellcheck --version
            strace --version
            printf 'pnpm_executable=%s\n' "$(command -v pnpm)"
          } > "$records/runner-environment.txt" 2>&1

          if [[ "$(git rev-parse HEAD)" != 4fd71b27b4bc3ab6bc68d9b7201c4ceeb5129f75 ]]; then
            echo 'The measured checkout is not the fixed 06 candidate.' >&2
            exit 1
          fi
          if [[ -e .github/workflows/infra-06-hosted-measurement.yml ]]; then
            echo 'The temporary measurement workflow leaked into the measured source checkout.' >&2
            exit 1
          fi
          if [[ -e .turbo || -e "$TEMPLATE_FIXTURE_EVIDENCE_DIR" || -e "$TEMPLATE_FIXTURE_BUILDKIT_CACHE_DIR" || -e "$TEMPLATE_FIXTURE_PNPM_CACHE_DIR" || -e "$TEMPLATE_FIXTURE_CARGO_CACHE_DIR" ]]; then
            echo 'A cold test-scope cache was unexpectedly present before cold.' >&2
            exit 1
          fi
          docker buildx du --builder infra-06-hosted > "$records/buildx-du-before-cold.txt"
          cat "$records/buildx-du-before-cold.txt"
          if ! grep -Eq '^Total:[[:space:]]+0B$' "$records/buildx-du-before-cold.txt"; then
            echo 'The fresh Buildx builder has a non-empty cache before cold.' >&2
            exit 1
          fi
          cat "$records/runner-environment.txt"

      - name: Run four formal Fixture gates cold then warm
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/run-infra-06-scope.sh" <<'BASH'
          #!/usr/bin/env bash
          set -uo pipefail

          measure_root=${MEASURE_ROOT:?}
          records="$measure_root/records"
          final_status=0
          pnpm_executable=$(command -v pnpm)
          export GITHUB_SHA=4fd71b27b4bc3ab6bc68d9b7201c4ceeb5129f75
          unset TURBO_TEAM TURBO_TOKEN TURBO_REMOTE_CACHE_SIGNATURE_KEY \
            TEMPLATE_FIXTURE_TURBO_TEAM TEMPLATE_FIXTURE_TURBO_TOKEN \
            TEMPLATE_FIXTURE_TURBO_REMOTE_CACHE_SIGNATURE_KEY TEMPLATE_FIXTURE_TURBO_REMOTE_CACHE_READ_ONLY
          printf 'phase\tstep\texit_code\tstarted_utc\tended_utc\telapsed_ms\tcommand\n' > "$records/steps.tsv"

          record_cache_state() {
            local phase=$1 point=$2 file="$records/$1/cache-$2.txt"
            {
              date -u '+captured_utc=%Y-%m-%dT%H:%M:%SZ'
              printf 'loadavg='
              cat /proc/loadavg
              grep '^Cpus_allowed_list:' /proc/self/status
              free -h
              df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
              for path in \
                "$GITHUB_WORKSPACE/.turbo" \
                "$TEMPLATE_FIXTURE_EVIDENCE_DIR" \
                "$TEMPLATE_FIXTURE_BUILDKIT_CACHE_DIR" \
                "$TEMPLATE_FIXTURE_PNPM_CACHE_DIR" \
                "$TEMPLATE_FIXTURE_CARGO_CACHE_DIR" \
                "$pnpm_config_store_dir" \
                "$PLAYWRIGHT_BROWSERS_PATH"; do
                if [[ -e "$path" ]]; then
                  printf '\npath=%s\n' "$path"
                  du -sh "$path" 2>&1 || true
                  file_count=$(find "$path" -type f -printf . 2>/dev/null | wc -c)
                  printf 'files=%s\n' "$file_count"
                else
                  printf 'path=%s\tstate=absent\n' "$path"
                fi
              done
            } > "$file"
            timeout --signal=TERM --kill-after=3s 30s docker buildx du --builder infra-06-hosted \
              > "$records/$phase/buildx-du-$point.txt" 2>&1 || true
          }

          run_gate() {
            local phase=$1 name=$2
            shift 2
            local phase_dir="$records/$phase"
            local started ended started_ms ended_ms elapsed status command_text
            started=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            started_ms=$(date +%s%3N)
            printf '%s start %s %s\n' "$phase" "$name" "$started" >> "$phase_dir/progress.log"
            command_text=$(printf '%q ' "$@")
            /usr/bin/time -f 'observer_wrapper_wall_seconds=%e observer_wrapper_user_seconds=%U observer_wrapper_sys_seconds=%S observer_wrapper_max_rss_kb=%M exit=%x' \
              -o "$phase_dir/$name.time" \
              strace -f --seccomp-bpf -qq -e trace=execve -P "$pnpm_executable" \
                -o "$phase_dir/$name.execve.log" -- "$@" > "$phase_dir/$name.log" 2>&1
            status=$?
            pnpm_dependency_install_calls=$(awk \
              '/execve\(/ && /\["[^"]*", "(install|i|add)"(,|\])/ && /= 0$/ { count++ } END { print count + 0 }' \
              "$phase_dir/$name.execve.log")
            printf 'host_pnpm_dependency_install_execve_successes=%s\npnpm_executable=%s\n' \
              "$pnpm_dependency_install_calls" "$pnpm_executable" > "$phase_dir/$name.pnpm-dependency-install-count.txt"
            ended=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            ended_ms=$(date +%s%3N)
            elapsed=$((ended_ms - started_ms))
            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
              "$phase" "$name" "$status" "$started" "$ended" "$elapsed" "$command_text" >> "$records/steps.tsv"
            printf '%s end exit=%s elapsed_ms=%s %s\n' "$phase" "$status" "$elapsed" "$ended" >> "$phase_dir/progress.log"
            if [[ "$status" -ne 0 ]]; then final_status=1; fi
          }

          for phase in cold warm; do
            phase_dir="$records/$phase"
            activity_dir="$measure_root/activity/$phase"
            mkdir -p "$phase_dir" "$activity_dir"
            export TEMPLATE_FIXTURE_EVIDENCE_ACTIVITY_DIR="$activity_dir"
            export TEMPLATE_FIXTURE_EVIDENCE_RUN_ID="infra-06-${GITHUB_RUN_ID}-${phase}"
            export TEMPLATE_FIXTURE_EVIDENCE_RUN_ATTEMPT="${GITHUB_RUN_ATTEMPT}"
            printf 'phase=%s\nsource_commit=%s\nrun_id=%s\nrun_attempt=%s\n' \
              "$phase" "$GITHUB_SHA" "$TEMPLATE_FIXTURE_EVIDENCE_RUN_ID" "$TEMPLATE_FIXTURE_EVIDENCE_RUN_ATTEMPT" > "$phase_dir/phase.txt"
            record_cache_state "$phase" before
            docker ps -a --no-trunc > "$phase_dir/docker-ps-before.txt" 2>&1 || true

            (
              while [[ ! -e "$phase_dir/stop-docker-stats" ]]; do
                captured=$(date -u +%Y-%m-%dT%H:%M:%SZ)
                snapshot=$(timeout --signal=TERM --kill-after=2s 10s docker stats --no-stream --format '{{json .}}' 2>> "$phase_dir/docker-stats-errors.log")
                result=$?
                if [[ "$result" -eq 0 ]]; then
                  while IFS= read -r row; do
                    [[ -n "$row" ]] && printf '%s\t%s\n' "$captured" "$row" >> "$phase_dir/docker-stats.jsonl"
                  done <<< "$snapshot"
                else
                  printf '%s\texit=%s\n' "$captured" "$result" >> "$phase_dir/docker-stats-errors.log"
                fi
                sleep 5
              done
            ) &
            stats_pid=$!

            run_gate "$phase" generated pnpm run check:generated
            run_gate "$phase" fixtures pnpm run check:fixtures
            run_gate "$phase" focused pnpm run check:focused
            run_gate "$phase" deployment pnpm run check:deployment
            run_gate "$phase" evidence-health pnpm --filter @ykdz/template-checks run check:evidence-health

            : > "$phase_dir/stop-docker-stats"
            wait "$stats_pid" 2>/dev/null || true
            docker ps -a --no-trunc > "$phase_dir/docker-ps-after.txt" 2>&1 || true
            docker buildx inspect infra-06-hosted > "$phase_dir/buildx-inspect-after.txt" 2>&1 || true
            record_cache_state "$phase" after

            fixture_container_ids=$(docker ps -aq --filter label=com.ykdz.template.fixture.project)
            list_status=$?
            if [[ "$list_status" -ne 0 ]]; then
              printf 'fixture_container_cleanup_exit=%s\n' "$list_status" >> "$phase_dir/phase.txt"
              final_status=1
            elif [[ -n "$fixture_container_ids" ]]; then
              mapfile -t fixture_containers <<< "$fixture_container_ids"
              docker rm -f "${fixture_containers[@]}" > "$phase_dir/fixture-container-cleanup.log" 2>&1
              cleanup_status=$?
              printf 'fixture_container_cleanup_exit=%s\n' "$cleanup_status" >> "$phase_dir/phase.txt"
              if [[ "$cleanup_status" -ne 0 ]]; then final_status=1; fi
            else
              printf 'fixture_container_cleanup_exit=0\nfixture_containers_removed=0\n' >> "$phase_dir/phase.txt"
            fi
            printf 'phase_gate_commands_completed=5\n' >> "$phase_dir/phase.txt"
            printf 'phase_completed_at=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$phase_dir/phase-complete.txt"
          done

          {
            printf '\n## Fixed candidate and scope\n\n'
            printf 'Source commit: `'
            git rev-parse HEAD
            printf '`\n\n'
            printf 'Both phases ran the four formal Fixture scenario-set commands and the evidence health command from the same checkout and preparation, in this order.\n\n'
            printf '| Phase | Gate | Exit | Wall ms | Observer wrapper CPU (user+sys) | Host pnpm dependency-install execve |\n|---|---|---:|---:|---:|---:|\n'
            while IFS=$'\t' read -r phase gate status started ended elapsed command; do
              [[ "$phase" == phase ]] && continue
              time_file="$records/$phase/$gate.time"
              cpu=$(sed -n 's/.*observer_wrapper_user_seconds=\([^ ]*\) observer_wrapper_sys_seconds=\([^ ]*\).*/user=\1s + sys=\2s/p' "$time_file" 2>/dev/null || true)
              install_count=$(sed -n 's/^host_pnpm_dependency_install_execve_successes=//p' "$records/$phase/$gate.pnpm-dependency-install-count.txt" 2>/dev/null || true)
              printf '| %s | `%s` | %s | %s | %s | %s |\n' "$phase" "$gate" "$status" "$elapsed" "${cpu:-unavailable}" "${install_count:-unavailable}"
            done < "$records/steps.tsv"
            printf '\nThe observed command wall/CPU includes the `strace` wrapper; CPU excludes Docker daemon and container CPU. The per-gate execve trace is filtered to the resolved host `pnpm` executable. Fixture-internal dependency installation phases remain recorded in the native activity JSONL. `docker-stats.jsonl` contains 5-second instantaneous container snapshots.\n'
            printf '\nThis job uses one `ubuntu-24.04` runner for both phases. `nproc`, `lscpu`, runner image, preparation command timings and explicit invocation counts, cache/evidence sizes, Docker/BuildKit diagnostics, raw fixture activity, and all ten gate results are in the uploaded evidence artifact. No `actions/cache` restore, setup-node package cache, Turbo remote-cache credentials, or publish step is used.\n'
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$final_status"
          BASH
          chmod +x "$RUNNER_TEMP/run-infra-06-scope.sh"
          "$RUNNER_TEMP/run-infra-06-scope.sh"

      - name: Upload isolated measurement records
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: infra-06-hosted-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/infra-06-measurement/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

name: 发布已验收的 npm 原件

on:
  workflow_dispatch:
    inputs:
      dist_tag:
        description: 预发布版本必填的 npm 非 latest 渠道；稳定版默认为 latest
        required: false
        type: string

permissions: {}

concurrency:
  group: npm-publication-${{ github.repository }}
  cancel-in-progress: false
  queue: max

jobs:
  verify:
    name: 验收原始制品
    uses: ./.github/workflows/check.yml
    with:
      publish_verified_candidate: true
    secrets:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}

  publish:
    name: 发布已验收的 tgz
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      GH_TOKEN: ${{ github.token }}
      PUBLICATION_DIST_TAG: ${{ inputs.dist_tag }}
      PUBLICATION_REPOSITORY_ROOT: ${{ github.workspace }}
      PUBLICATION_PACKAGE_ROOT: ${{ github.workspace }}/packages/cli
    steps:
      - name: 检出原始源码提交
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: 配置 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
      - name: 配置 pnpm
        uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
        with:
          cache: true
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 下载已验收的原始 tgz 和回执
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-packed-publication-${{ github.run_id }}
          path: ${{ runner.temp }}/accepted-publication
      - name: 恢复本次运行中已持久化的上传尝试
        id: restore-attempt
        run: pnpm --filter @ykdz/reference-npm-publication run publication:remote:restore-attempt
        env:
          PUBLICATION_ARTIFACT_DIRECTORY: ${{ runner.temp }}/accepted-publication
      - name: 在已验收回执中记录首次上传尝试
        if: steps.restore-attempt.outputs.restored != 'true'
        run: pnpm --filter @ykdz/reference-npm-publication run publication:remote:mark-attempt
        env:
          PUBLICATION_ARTIFACT_DIRECTORY: ${{ runner.temp }}/accepted-publication
      - name: 在写入 npm 前持久化上传尝试
        if: steps.restore-attempt.outputs.restored != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-publication-attempt-${{ github.run_id }}
          path: ${{ runner.temp }}/accepted-publication/publication-preparation.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: 使用 pnpm OIDC 发布已验收的原始 tgz
        run: pnpm --filter @ykdz/reference-npm-publication run publication:remote:publish
        env:
          PUBLICATION_ARTIFACT_DIRECTORY: ${{ runner.temp }}/accepted-publication

  release:
    name: 创建不可变 GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      GH_TOKEN: ${{ github.token }}
      PUBLICATION_REPOSITORY_ROOT: ${{ github.workspace }}
      PUBLICATION_PACKAGE_ROOT: ${{ github.workspace }}/packages/cli
    steps:
      - name: 检出原始源码提交
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: 配置 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
      - name: 配置 pnpm
        uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
        with:
          cache: true
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 下载同一份已验收的原始 tgz 和回执
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-packed-publication-${{ github.run_id }}
          path: ${{ runner.temp }}/accepted-publication
      - name: 创建并核验不可变 GitHub Release
        run: pnpm --filter @ykdz/reference-npm-publication run publication:remote:release
        env:
          PUBLICATION_ARTIFACT_DIRECTORY: ${{ runner.temp }}/accepted-publication

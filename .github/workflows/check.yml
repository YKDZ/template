name: Check

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:
    inputs:
      pack_cli:
        description: 打包并验收 CLI 分发制品
        required: false
        type: boolean
        default: false
    secrets:
      TURBO_TOKEN:
        required: false
      TURBO_REMOTE_CACHE_SIGNATURE_KEY:
        required: false
    outputs:
      pack_artifact_id:
        description: Changesets 打包制品 ID
        value: ${{ jobs.check.outputs.pack_artifact_id }}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: 检查源码与独立能力
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
    outputs:
      pack_artifact_id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    env:
      TEMPLATE_FIXTURE_EVIDENCE_DIR: ${{ github.workspace }}/.fixture-evidence
      TEMPLATE_FIXTURE_EVIDENCE_READ: "1"
      TEMPLATE_FIXTURE_EVIDENCE_WRITE: "1"
      TEMPLATE_FIXTURE_EVIDENCE_ACTIVITY_DIR: ${{ github.workspace }}/.fixture-evidence-activity
      TEMPLATE_FIXTURE_EVIDENCE_RUN_ID: ${{ github.run_id }}
      TEMPLATE_FIXTURE_EVIDENCE_RUN_ATTEMPT: ${{ github.run_attempt }}
      TEMPLATE_FIXTURE_BUILDKIT_CACHE_DIR: ${{ github.workspace }}/.fixture-native-cache/buildkit
      TEMPLATE_FIXTURE_PNPM_CACHE_DIR: ${{ github.workspace }}/.fixture-native-cache/pnpm
      TEMPLATE_FIXTURE_CARGO_CACHE_DIR: ${{ github.workspace }}/.fixture-native-cache/cargo
      TEMPLATE_CLI_JOURNEY_DIAGNOSTICS_DIR: ${{ github.workspace }}/.cli-journey-diagnostics
      TEMPLATE_BUILTIN_PRESET_DIAGNOSTICS_DIR: ${{ github.workspace }}/.preset-behavior-diagnostics
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check package
        id: package-check
        run: node --conditions=source --experimental-strip-types scripts/run-task-gate.ts check

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Restore BuildKit cache
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main' && job.workflow_ref == github.workflow_ref) || github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && job.workflow_ref == github.workflow_ref)
        uses: actions/cache/restore@v6
        with:
          path: .fixture-native-cache/buildkit
          key: fixture-buildkit-${{ runner.os }}-${{ hashFiles('content/default/composition/assets/environment/**/*.Dockerfile', 'content/default/composition/assets/environment/devcontainer/workspace-template.json', 'content/default/presets/vike-app/resources/deployment/Dockerfile', 'packages/environment/src/development-container-tool-layer.ts') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            fixture-buildkit-${{ runner.os }}-${{ hashFiles('content/default/composition/assets/environment/**/*.Dockerfile', 'content/default/composition/assets/environment/devcontainer/workspace-template.json', 'content/default/presets/vike-app/resources/deployment/Dockerfile', 'packages/environment/src/development-container-tool-layer.ts') }}-
            fixture-buildkit-${{ runner.os }}-

      - name: Restore pnpm downloads cache
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main' && job.workflow_ref == github.workflow_ref) || github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && job.workflow_ref == github.workflow_ref)
        uses: actions/cache/restore@v6
        with:
          path: .fixture-native-cache/pnpm
          key: fixture-pnpm-downloads-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            fixture-pnpm-downloads-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            fixture-pnpm-downloads-${{ runner.os }}-

      - name: Restore Cargo downloads cache
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main' && job.workflow_ref == github.workflow_ref) || github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && job.workflow_ref == github.workflow_ref)
        uses: actions/cache/restore@v6
        with:
          path: .fixture-native-cache/cargo
          key: fixture-cargo-downloads-${{ runner.os }}-${{ hashFiles('content/default/references/rust-bin/Cargo.lock', 'rust-toolchain.toml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            fixture-cargo-downloads-${{ runner.os }}-${{ hashFiles('content/default/references/rust-bin/Cargo.lock', 'rust-toolchain.toml') }}-
            fixture-cargo-downloads-${{ runner.os }}-

      - name: Restore Fixture Verification Evidence
        uses: actions/cache/restore@v6
        with:
          path: .fixture-evidence
          key: fixture-verification-evidence-${{ runner.os }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            fixture-verification-evidence-${{ runner.os }}-

      - name: Validate Fixture Gate Prerequisites
        id: fixture-prerequisites
        run: |
          docker version --format '{{.Server.Version}}'
          pnpm --filter @ykdz/template-checks exec devcontainer --version

      - name: Prepare shell checks
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Check heavy gate
        if: always() && steps.package-check.outcome == 'success'
        run: node --conditions=source --experimental-strip-types scripts/run-task-gate.ts check:heavy
        env:
          TURBO_CONCURRENCY: "1"
          TEMPLATE_FIXTURE_TURBO_TEAM: ${{ vars.TURBO_TEAM }}
          TEMPLATE_FIXTURE_TURBO_TOKEN: ${{ (((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch') && job.workflow_ref == github.workflow_ref || github.event_name == 'release') && secrets.TURBO_TOKEN || '' }}
          TEMPLATE_FIXTURE_TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ (((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch') && job.workflow_ref == github.workflow_ref || github.event_name == 'release') && secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY || '' }}
          TEMPLATE_FIXTURE_TURBO_REMOTE_CACHE_READ_ONLY: ${{ (((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch') && job.workflow_ref == github.workflow_ref) && 'false' || 'true' }}

      - name: 显示失败时的内核资源诊断
        if: failure()
        run: sudo dmesg --level=err,warn --time-format=iso | tail -n 80

      - name: Check Fixture Evidence Health
        id: fixture-evidence-health
        if: always() && steps.package-check.outcome == 'success'
        run: pnpm --filter @ykdz/template-checks run check:evidence-health

      - name: 构建 CLI 分发目录
        if: inputs.pack_cli
        run: pnpm --filter @ykdz/template run build:distribution

      - name: 打包待发布版本
        id: pack
        if: inputs.pack_cli
        uses: changesets/action/pack@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2

      - name: 下载打包制品以验收
        if: inputs.pack_cli
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.pack.outputs.pack-dir-artifact-id }}
          path: ${{ runner.temp }}/packed-cli
          merge-multiple: true

      - name: 验收安装后的 CLI
        if: inputs.pack_cli
        run: |
          if compgen -G "$RUNNER_TEMP/packed-cli/packages/ykdz-template-*.tgz" > /dev/null; then
            npm install --prefix "$RUNNER_TEMP/template-consumer" "$RUNNER_TEMP/packed-cli/packages/"ykdz-template-*.tgz
            TEMPLATE_CLI_JOURNEY_MODE=packed TEMPLATE_CLI_PACKED_BIN="$RUNNER_TEMP/template-consumer/node_modules/.bin/template" pnpm --filter @ykdz/template run test:e2e:packed
          fi

      - name: 清理测试容器
        if: always() && steps.fixture-prerequisites.outcome == 'success'
        run: |
          fixture_container_ids="$(docker ps -aq --filter label=com.ykdz.template.verification.project)"
          if [[ -n "$fixture_container_ids" ]]; then
            readarray -t fixture_containers <<< "$fixture_container_ids"
            docker rm -f "${fixture_containers[@]}"
          fi

      - name: 恢复 Fixture 诊断属主
        if: always() && steps.fixture-prerequisites.outcome == 'success'
        run: |
          if [ -d .fixture-workspace ]; then
            sudo chown -hR "$(id -u):$(id -g)" -- .fixture-workspace
          fi

      - name: Upload Fixture Evidence Activity
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fixture-evidence-activity-${{ github.run_id }}-${{ github.run_attempt }}
          path: .fixture-evidence-activity/activity.jsonl
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Fixture Failure Diagnostics
        if: always() && steps.fixture-prerequisites.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: fixture-failure-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .fixture-workspace/**
            !.fixture-workspace/**/node_modules/**
            !.fixture-workspace/**/.pnpm-store/**
            !.fixture-workspace/**/.npm/**
            !.fixture-workspace/**/.cargo/registry/**
            !.fixture-workspace/**/.cargo/git/**
            !.fixture-workspace/**/target/**
            !.fixture-workspace/**/.cache/**
            !.fixture-workspace/**/.turbo/cache/**
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload CLI Journey Diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cli-journey-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .cli-journey-diagnostics/**
            !.cli-journey-diagnostics/**/node_modules/**
            !.cli-journey-diagnostics/**/.pnpm-store/**
            !.cli-journey-diagnostics/**/.npm/**
            !.cli-journey-diagnostics/**/.cargo/registry/**
            !.cli-journey-diagnostics/**/.cargo/git/**
            !.cli-journey-diagnostics/**/target/**
            !.cli-journey-diagnostics/**/.cache/**
            !.cli-journey-diagnostics/**/.turbo/cache/**
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Preset Behavior Diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: preset-behavior-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .preset-behavior-diagnostics/**
            !.preset-behavior-diagnostics/**/node_modules/**
            !.preset-behavior-diagnostics/**/.pnpm-store/**
            !.preset-behavior-diagnostics/**/.npm/**
            !.preset-behavior-diagnostics/**/.cargo/registry/**
            !.preset-behavior-diagnostics/**/.cargo/git/**
            !.preset-behavior-diagnostics/**/target/**
            !.preset-behavior-diagnostics/**/.cache/**
            !.preset-behavior-diagnostics/**/.turbo/cache/**
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

      - name: Save BuildKit cache
        if: always() && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch') && job.workflow_ref == github.workflow_ref && steps.fixture-evidence-health.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: .fixture-native-cache/buildkit
          key: fixture-buildkit-${{ runner.os }}-${{ hashFiles('content/default/composition/assets/environment/**/*.Dockerfile', 'content/default/composition/assets/environment/devcontainer/workspace-template.json', 'content/default/presets/vike-app/resources/deployment/Dockerfile', 'packages/environment/src/development-container-tool-layer.ts') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save pnpm downloads cache
        if: always() && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch') && job.workflow_ref == github.workflow_ref && steps.fixture-evidence-health.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: .fixture-native-cache/pnpm
          key: fixture-pnpm-downloads-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save Cargo downloads cache
        if: always() && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch') && job.workflow_ref == github.workflow_ref && steps.fixture-evidence-health.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: .fixture-native-cache/cargo
          key: fixture-cargo-downloads-${{ runner.os }}-${{ hashFiles('content/default/references/rust-bin/Cargo.lock', 'rust-toolchain.toml') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save Fixture Verification Evidence
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && job.workflow_ref == github.workflow_ref && steps.fixture-evidence-health.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: .fixture-evidence
          key: fixture-verification-evidence-${{ runner.os }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

name: Check

on:
  pull_request:
  push:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Check package and fixture matrix
    runs-on: ubuntu-latest
    env:
      TEMPLATE_FIXTURE_EVIDENCE_DIR: ${{ github.workspace }}/.fixture-evidence
      TEMPLATE_FIXTURE_EVIDENCE_READ: "1"
      TEMPLATE_FIXTURE_EVIDENCE_WRITE: "0"
      TEMPLATE_FIXTURE_EVIDENCE_ACTIVITY_DIR: ${{ github.workspace }}/.fixture-evidence-activity
      TEMPLATE_FIXTURE_EVIDENCE_RUN_ID: ${{ github.run_id }}
      TEMPLATE_FIXTURE_EVIDENCE_RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Restore Fixture Verification Evidence
        uses: actions/cache/restore@v6
        with:
          path: .fixture-evidence
          key: fixture-verification-evidence-${{ runner.os }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            fixture-verification-evidence-${{ runner.os }}-

      - name: Enable trusted evidence publication
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && job.workflow_ref == github.workflow_ref
        run: echo "TEMPLATE_FIXTURE_EVIDENCE_WRITE=1" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare shell checks
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Prepare browser checks
        run: pnpm --filter @ykdz/template-builtin-presets exec playwright install --with-deps chromium

      - name: Check package
        run: pnpm run check

      - name: Check fixture matrix
        if: always()
        run: pnpm run check:fixtures

      - name: Check focused project links
        if: always()
        run: pnpm run check:focused

      - name: Check deployment artifacts
        if: always()
        run: pnpm run check:deployment

      - name: Check Fixture Evidence Health
        id: fixture-evidence-health
        if: always()
        run: pnpm --filter @ykdz/template-checks run check:evidence-health

      - name: Save Fixture Verification Evidence
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && job.workflow_ref == github.workflow_ref && steps.fixture-evidence-health.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: .fixture-evidence
          key: fixture-verification-evidence-${{ runner.os }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

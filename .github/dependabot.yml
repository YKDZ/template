version: 2

updates:
  - package-ecosystem: devcontainers
    directories:
      - /
      - /packages/environment/assets
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      drizzle:
        patterns:
          - "drizzle-*"
          - "drizzle-orm"
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
      - dependency-name: "pnpm"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
  - package-ecosystem: github-actions
    directories:
      - /
      - /packages/workspace/assets/github
      - /packages/workspace/publication
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directories:
      - /.devcontainer
      - /packages/environment/assets
      - /packages/workspace/deployment
    schedule:
      interval: weekly
    ignore:
      - dependency-name: mcr.microsoft.com/devcontainers/typescript-node
        update-types:
          - version-update:semver-major
  - package-ecosystem: cargo
    directory: /reference/rust-bin
    schedule:
      interval: weekly
  - package-ecosystem: rust-toolchain
    directory: /
    schedule:
      interval: weekly
